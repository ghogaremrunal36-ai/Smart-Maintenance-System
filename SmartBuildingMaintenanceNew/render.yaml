services:
  - type: web
    name: smart-building-maintenance
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: smart_building_new
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
